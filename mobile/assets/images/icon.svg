<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep Obsidian Space Canvas -->
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="40%" stop-color="#141418"/>
      <stop offset="75%" stop-color="#0B0B0E"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>

    <!-- Electric Blue Ambient Halo -->
    <radialGradient id="ambientBlue" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#0071E3" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Electric Node Core -->
    <radialGradient id="nodeCore" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="75%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#004499"/>
    </radialGradient>

    <!-- Metallic Letter Gradient -->
    <linearGradient id="whiteLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAEAEF"/>
    </linearGradient>

    <!-- Subtle Top Sheen -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Blur for Node Aura -->
    <filter id="nodeGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Top Ambient Glass Sheen -->
  <rect width="1024" height="460" fill="url(#topSheen)"/>

  <!-- Central Electric Blue Ambient Flare -->
  <circle cx="512" cy="485" r="380" fill="url(#ambientBlue)"/>

  <!-- Main I·D Monogram Logo Group -->
  <!-- Center of canvas: 512, 480 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <!-- Letter "I" -->
    <text x="290" y="585" text-anchor="middle" font-size="330" fill="url(#whiteLetter)" letter-spacing="-4">
      I
    </text>

    <!-- Radiant Electric Blue Connector Node (Centered at 512, 480) -->
    <!-- Outer Aura Blur -->
    <circle cx="512" cy="485" r="64" fill="#0071E3" opacity="0.30" filter="url(#nodeGlowFilter)"/>
    <circle cx="512" cy="485" r="42" fill="#0071E3" opacity="0.55"/>
    <!-- Crisp Glossy Core -->
    <circle cx="512" cy="485" r="30" fill="url(#nodeCore)"/>
    <!-- Specular Highlight Spot -->
    <circle cx="503" cy="476" r="9" fill="#FFFFFF" opacity="0.85"/>

    <!-- Letter "D" -->
    <text x="734" y="585" text-anchor="middle" font-size="330" fill="url(#whiteLetter)" letter-spacing="-4">
      D
    </text>
  </g>

  <!-- Bottom Brand Sub-Pill: "LESTRADES" -->
  <g transform="translate(512, 770)">
    <rect x="-195" y="-30" width="390" height="60" rx="30" fill="#141418" stroke="#0071E3" stroke-width="2.5"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="22" font-weight="800" letter-spacing="11" fill="#FFFFFF">
      LESTRADES
    </text>
  </g>
</svg>
