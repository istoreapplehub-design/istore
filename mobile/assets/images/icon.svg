<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep Obsidian Radial Gradient -->
    <radialGradient id="bgFull" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1B0709"/>
      <stop offset="30%" stop-color="#0F090B"/>
      <stop offset="65%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>

    <!-- Vibrant Crimson Ambient Core -->
    <radialGradient id="haloFull" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#E50914" stop-opacity="0.08"/>
      <stop offset="90%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>

    <!-- Red Dash Gradient -->
    <linearGradient id="dashGradFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>

    <!-- Top Specular Sheen Gradient -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Obsidian Background -->
  <rect width="1024" height="1024" fill="url(#bgFull)"/>

  <!-- Top Subtle Specular Light -->
  <rect width="1024" height="400" fill="url(#topSheen)"/>

  <!-- Ambient Crimson Flare Behind Text -->
  <circle cx="512" cy="510" r="480" fill="url(#haloFull)"/>

  <!-- Apple Silhouette Glyph Above Text -->
  <g transform="translate(512, 310) scale(2.3)">
    <!-- Red Leaf -->
    <path d="M-0.8 -48.2 C2.1 -51.8 4.2 -56.8 3.6 -62 C-0.8 -61.8 -6.2 -59 -9.1 -55.4 C-11.7 -52.2 -14 -47.1 -13.3 -42.1 C-8.2 -41.7 -3.5 -44.8 -0.8 -48.2 Z" fill="#E50914"/>
    <!-- White Body -->
    <path d="M14.9 -24.4 C14.9 -33.6 22.4 -38.2 22.8 -38.4 C18.5 -44.7 11.9 -45.6 9.6 -45.8 C4 -46.4 -1.4 -42.4 -4.3 -42.4 C-7.2 -42.4 -11.6 -46.2 -16.3 -46.1 C-22.3 -46 -28 -42.5 -31.1 -37.1 C-37.4 -26.1 -32.7 -9.7 -26.7 -1 C-23.7 3.3 -20.3 8.1 -15.6 7.9 C-11.1 7.7 -9.3 5 -4.2 5 C1 5 2.6 7.9 7.3 7.8 C12.2 7.7 15.2 3.4 18.2 -1 C21.7 -6.1 23.1 -11 23.3 -11.5 C23.1 -11.6 14.9 -14.8 14.9 -24.4 Z" fill="#FFFFFF"/>
  </g>

  <!-- Main Hero Brand Typography "I-Store" (Horizontally Centered) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <!-- Letter "I" -->
    <text x="207" y="555" font-size="190" fill="#FFFFFF" letter-spacing="-3">I</text>

    <!-- Custom Crimson Pill Hyphen "-" -->
    <rect x="277" y="488" width="48" height="20" rx="10" fill="url(#dashGradFull)"/>

    <!-- Word "Store" -->
    <text x="345" y="555" font-size="190" fill="#FFFFFF" letter-spacing="-3">Store</text>
  </g>

  <!-- Tagline Pill: APPLE HUB -->
  <g transform="translate(512, 665)">
    <!-- Pill Container -->
    <rect x="-145" y="-24" width="290" height="48" rx="24" fill="#170608" stroke="#E50914" stroke-width="2.2"/>
    <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="21" font-weight="800" letter-spacing="9" fill="#FFFFFF">
      APPLE HUB
    </text>
  </g>

  <!-- Bottom Red Accent Jewel -->
  <circle cx="512" cy="760" r="5" fill="#E50914"/>
  <line x1="442" y1="760" x2="490" y2="760" stroke="#E50914" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="534" y1="760" x2="582" y2="760" stroke="#E50914" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
