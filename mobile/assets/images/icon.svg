<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep Obsidian Radial Space Gradient -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="35%" stop-color="#141418"/>
      <stop offset="70%" stop-color="#0B0B0E"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>

    <!-- Electric Apple Blue Ambient Halo -->
    <radialGradient id="blueGlow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#0071E3" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Electric Dot Radial -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#0051A8"/>
    </radialGradient>

    <!-- Top Ambient Sheen -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Lettering Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E2E8"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed App Icon Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Top Glass Highlight -->
  <rect width="1024" height="420" fill="url(#topSheen)"/>

  <!-- Ambient Electric Blue Glow Behind Emblem -->
  <circle cx="512" cy="520" r="440" fill="url(#blueGlow)"/>

  <!-- Apple Silhouette Glyph Above Monogram -->
  <g transform="translate(512, 275) scale(2.2)">
    <!-- Electric Blue Leaf -->
    <path d="M-0.8 -48.2 C2.1 -51.8 4.2 -56.8 3.6 -62 C-0.8 -61.8 -6.2 -59 -9.1 -55.4 C-11.7 -52.2 -14 -47.1 -13.3 -42.1 C-8.2 -41.7 -3.5 -44.8 -0.8 -48.2 Z" fill="#0071E3"/>
    <!-- Crisp White Apple Body -->
    <path d="M14.9 -24.4 C14.9 -33.6 22.4 -38.2 22.8 -38.4 C18.5 -44.7 11.9 -45.6 9.6 -45.8 C4 -46.4 -1.4 -42.4 -4.3 -42.4 C-7.2 -42.4 -11.6 -46.2 -16.3 -46.1 C-22.3 -46 -28 -42.5 -31.1 -37.1 C-37.4 -26.1 -32.7 -9.7 -26.7 -1 C-23.7 3.3 -20.3 8.1 -15.6 7.9 C-11.1 7.7 -9.3 5 -4.2 5 C1 5 2.6 7.9 7.3 7.8 C12.2 7.7 15.2 3.4 18.2 -1 C21.7 -6.1 23.1 -11 23.3 -11.5 C23.1 -11.6 14.9 -14.8 14.9 -24.4 Z" fill="#FFFFFF"/>
  </g>

  <!-- Central "I.D" Signature Monogram -->
  <g transform="translate(512, 535)">
    <!-- Letter "I" -->
    <text x="-165" y="65" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
          font-size="240" font-weight="900" fill="url(#letterGrad)" letter-spacing="-2">
      I
    </text>

    <!-- Electric Blue Connector Node "." with Radiant Glow -->
    <circle cx="-50" cy="18" r="42" fill="#0071E3" opacity="0.25" filter="url(#glow)"/>
    <circle cx="-50" cy="18" r="28" fill="#0071E3" opacity="0.5"/>
    <circle cx="-50" cy="18" r="18" fill="url(#nodeGlow)"/>
    <circle cx="-53" cy="14" r="6" fill="#FFFFFF" opacity="0.7"/>

    <!-- Letter "D" -->
    <text x="110" y="65" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
          font-size="240" font-weight="900" fill="url(#letterGrad)" letter-spacing="-2">
      D
    </text>
  </g>

  <!-- Bottom Brand Sub-Pill: "I-DYNAMIC" -->
  <g transform="translate(512, 740)">
    <rect x="-185" y="-28" width="370" height="56" rx="28" fill="#15151B" stroke="#0071E3" stroke-width="2.5"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="21" font-weight="800" letter-spacing="10" fill="#FFFFFF">
      I-DYNAMIC
    </text>
  </g>

  <!-- Apple Hub Subtitle -->
  <text x="512" y="830" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="16" font-weight="700" letter-spacing="8" fill="#6B7280">
    APPLE HUB
  </text>
</svg>
